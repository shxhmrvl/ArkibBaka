name: Extract and deploy Arkib:Baka
on:
  push:
    branches: [main]
    paths:
      - 'Arkib-Baka-website.zip'
      - '.github/workflows/unpack-deploy.yml'
      - '.github/workflows/unpack-deploy-fixed.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract uploaded website ZIP
        run: |
          test -f Arkib-Baka-website.zip
          mkdir -p /tmp/arkib-site
          unzip -oq Arkib-Baka-website.zip -d /tmp/arkib-site
          test -d /tmp/arkib-site/Arkib-Baka
          cp -a /tmp/arkib-site/Arkib-Baka/. .
          test -f package.json
          test -f src/main.jsx
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
